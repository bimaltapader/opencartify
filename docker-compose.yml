
services:
  database:
    image: postgres:17-alpine
    container_name: opencartify-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opencartify}
      POSTGRES_USER: ${POSTGRES_USER:-opencartify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - opencartify_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-opencartify} -d ${POSTGRES_DB:-opencartify}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  opencartify_postgres_data:
